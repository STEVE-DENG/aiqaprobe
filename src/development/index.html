<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>开发工作台 | AIQA 研究站</title><meta name="description" content="为开源工具提出建议，跟进自动开发、代码审查与版本交付。"><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/styles.css?v=20261107"><link rel="stylesheet" href="/development/workbench.css"></head><body><!--HEADER--><main id="main" class="wrap workbench"><div class="workbench-intro"><a href="/" class="back-link">首页 / 开发工作台</a><h1>从一个建议，<br>到一次改进。</h1><p>AI Proxy、App Test Agent 和 PureEval 的建议与开发进度，集中在这里。</p><p class="service-status" id="service-status" role="status">正在连接工作台…</p></div><ol class="delivery-path" aria-label="交付流程"><li>提交建议</li><li>安全审查</li><li>计划与开发</li><li>代码审查</li><li>合并与归档</li></ol><div class="workbench-layout"><section class="suggestion-panel" aria-labelledby="suggestion-title"><h2 id="suggestion-title">想改进什么？</h2><p>说清遇到了什么，以及你希望它怎样工作。请勿填写密码、密钥或私人信息。</p><form id="suggestion-form"><label for="project">开源项目</label><select name="project" id="project"><option value="ai-proxy">AI Proxy</option><option value="app-test-agent">App Test Agent</option><option value="ai-judge-agent">PureEval</option></select><label for="suggestion-name">一句话描述</label><input id="suggestion-name" name="title" minlength="4" maxlength="80" required placeholder="例如：筛选请求后，保留上一次的条件"><label for="suggestion-detail">问题与期望</label><textarea id="suggestion-detail" name="detail" rows="7" minlength="15" maxlength="2000" required placeholder="在哪里遇到了什么问题？你希望改成什么样？"></textarea><div id="challenge"></div><button id="submit-suggestion" class="button button-primary" disabled>提交建议</button><p id="submit-status" role="status" aria-live="polite"></p></form><a id="github-fallback" href="https://github.com/STEVE-DENG/ai-proxy/issues/new" target="_blank" rel="noopener noreferrer">也可以通过 GitHub 反馈 ↗</a><p class="workbench-note">建议通过安全审查后进入开发；超出范围的需求会被拒绝。自动交付不代表已通过测试。</p></section><section class="task-panel" aria-labelledby="tasks-title"><div class="task-heading"><h2 id="tasks-title">开发记录</h2><button type="button" id="refresh-tasks">刷新</button></div><div class="task-filters"><label>项目<select id="filter-project"><option value="all">全部项目</option><option value="ai-proxy">AI Proxy</option><option value="app-test-agent">App Test Agent</option><option value="ai-judge-agent">PureEval</option></select></label><label>进度<select id="filter-state"><option value="all">全部进度</option><option value="active">正在推进</option><option value="completed">已完成</option><option value="failed">未完成</option></select></label></div><p id="tasks-status" role="status"></p><p id="tracked-task" role="status"></p><div id="task-list"></div></section></div></main><!--FOOTER--><script type="module" src="/development/workbench.js"></script></body></html>
